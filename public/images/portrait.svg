<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Portrait Sena Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c5e8d2"/>
      <stop offset="100%" stop-color="#68ba87"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242322"/>
      <stop offset="100%" stop-color="#161514"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="380" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="56" y="56" width="688" height="688" fill="url(#glow)"/>

  <!-- silhouette -->
  <circle cx="400" cy="330" r="128" fill="url(#ink)"/>
  <path d="M196 640c34-110 110-166 204-166s170 56 204 166c-52 54-122 84-204 84s-152-30-204-84Z" fill="url(#ink)"/>

  <text x="400" y="700" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="6" fill="#ffffff" fill-opacity="0.85">SENA STUDIO</text>
</svg>