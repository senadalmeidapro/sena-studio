<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Mini Shop storefront</title><desc id="desc">Structured storefront interface connected to an application API.</desc><rect width="1200" height="760" fill="#f8fafc"/><rect x="54" y="52" width="1092" height="656" rx="18" fill="#fff" stroke="#dbe3ef" stroke-width="2"/><rect x="54" y="52" width="1092" height="82" rx="18" fill="#0b1f3a"/><circle cx="98" cy="93" r="9" fill="#3b82f6"/><text x="126" y="101" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Mini Shop</text><text x="850" y="101" fill="#bfdbfe" font-family="monospace" font-size="16">catalog / cart / checkout</text><text x="94" y="196" fill="#0f172a" font-family="Arial,sans-serif" font-size="34" font-weight="700">A storefront built around a clear API</text><text x="94" y="232" fill="#64748b" font-family="Arial,sans-serif" font-size="18">Vue interface · REST integration · responsive flows</text><g fill="#eff6ff" stroke="#bfdbfe"><rect x="94" y="286" width="300" height="224" rx="12"/><rect x="450" y="286" width="300" height="224" rx="12"/><rect x="806" y="286" width="250" height="224" rx="12"/></g><g fill="#155eef" font-family="Arial,sans-serif" font-size="20"><text x="124" y="338">Products</text><text x="480" y="338">Cart</text><text x="836" y="338">Checkout</text></g><g fill="#94a3b8" font-family="monospace" font-size="15"><text x="124" y="382">GET /products</text><text x="480" y="382">POST /cart/items</text><text x="836" y="382">POST /orders</text></g><text x="94" y="628" fill="#475569" font-family="monospace" font-size="17">The visual layer stays simple so the underlying workflow remains legible.</text></svg>
